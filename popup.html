<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultBix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="vb-popup">

        <!-- ============================================================ -->
        <!-- Header                                                       -->
        <!-- ============================================================ -->
        <header class="vb-header">
            <div class="vb-brand">
                <img src="icons/icon-vb.png"
                     class="vb-brand__logo"
                     alt="VaultBix"
                     width="32"
                     height="32"
                     style="border-radius: 7px; display: block;">
                <span class="vb-brand__name">VaultBix</span>
            </div>
            <div class="vb-shield" id="vbShield" data-state="active" title="Protection active">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 12l2 2 4-4"
                          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </header>

        <!-- One-line status -->
        <div class="vb-status" id="vbStatus">Protected — 0 leaks today</div>

        <!-- ============================================================ -->
        <!-- Stats                                                         -->
        <!-- ============================================================ -->
        <section class="vb-stats">
            <div class="vb-stat vb-stat--today">
                <div class="vb-stat__label">Today</div>
                <div class="vb-stat__value" id="vbBlockedToday">0</div>
            </div>
            <div class="vb-stat vb-stat--total">
                <div class="vb-stat__label">All time</div>
                <div class="vb-stat__value" id="vbBlockedTotal">0</div>
            </div>
            <div class="vb-stat vb-stat--sites">
                <div class="vb-stat__label">Sites</div>
                <div class="vb-stat__value" id="vbSitesMonitored">0</div>
            </div>
        </section>

        <!-- ============================================================ -->
        <!-- Protection toggle                                             -->
        <!-- ============================================================ -->
        <section class="vb-toggle-card">
            <div class="vb-toggle-row">
                <div class="vb-toggle-info">
                    <div class="vb-toggle-title">Protection</div>
                    <div class="vb-toggle-domain" id="vbDomain">Protecting: —</div>
                </div>
                <button class="vb-pill" id="vbProtectionToggle" type="button" role="switch" aria-checked="true">
                    <span class="vb-pill__knob"></span>
                    <span class="vb-pill__label-on">ON</span>
                    <span class="vb-pill__label-off">OFF</span>
                </button>
            </div>
        </section>

        <!-- ============================================================ -->
        <!-- Recent incidents                                              -->
        <!-- ============================================================ -->
        <section class="vb-section">
            <div class="vb-section__header">
                <h2 class="vb-section__title">Recent incidents</h2>
                <button class="vb-link" id="vbClearHistory" type="button">Clear</button>
            </div>
            <ul class="vb-incidents" id="vbIncidents">
                <!-- populated by JS, falls back to empty state -->
            </ul>
        </section>

        <!-- ============================================================ -->
        <!-- Enterprise connection status                                  -->
        <!-- ============================================================ -->
        <section class="vb-enterprise" id="vbEnterprise" style="display:none;">
            <div class="vb-enterprise__row">
                <div class="vb-enterprise__info">
                    <div class="vb-enterprise__label">Organization</div>
                    <div class="vb-enterprise__org" id="vbOrgName">—</div>
                </div>
                <span class="vb-enterprise__badge" id="vbEntBadge">Connected</span>
            </div>
        </section>

        <!-- ============================================================ -->
        <!-- Dashboard + Connect buttons                                   -->
        <!-- ============================================================ -->
        <section class="vb-actions">
            <button class="vb-action-btn vb-action-btn--dashboard" id="vbOpenDashboard" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                Dashboard
            </button>
            <button class="vb-action-btn vb-action-btn--connect" id="vbConnectBtn" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                <span id="vbConnectLabel">Connect to Org</span>
            </button>
        </section>

        <!-- ============================================================ -->
        <!-- Sensitivity selector                                          -->
        <!-- ============================================================ -->
        <section class="vb-sensitivity">
            <div class="vb-sensitivity__label">Sensitivity</div>
            <div class="vb-segmented" role="tablist" id="vbSensitivity">
                <button class="vb-segmented__btn" data-value="strict"  type="button" role="tab">Strict</button>
                <button class="vb-segmented__btn" data-value="balanced" type="button" role="tab">Balanced</button>
                <button class="vb-segmented__btn" data-value="minimal"  type="button" role="tab">Minimal</button>
            </div>
        </section>

        <!-- ============================================================ -->
        <!-- Toast slot                                                    -->
        <!-- ============================================================ -->
        <div class="vb-toast-slot" id="vbToastSlot" aria-live="polite"></div>

    </div>

    <script src="popup.js"></script>
</body>
</html>
