<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultBix Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--vb-bg); padding: 32px; }
        .vb-dash {
            max-width: 880px;
            margin: 0 auto;
            background: var(--vb-surface);
            border: 1px solid var(--vb-border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--vb-shadow);
        }
        .vb-dash__brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .vb-dash__brand svg,
        .vb-dash__brand img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            box-shadow: 0 0 0 1px var(--vb-border), 0 4px 12px rgba(255, 107, 26, 0.18);
            display: block;
        }
        .vb-dash__brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--vb-text);
        }
        .vb-dash h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin: 0 0 4px;
            color: var(--vb-text);
        }
        .vb-dash p.muted { color: var(--vb-text-mute); margin: 0 0 24px; font-size: 14px; }
        .vb-dash-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .vb-dash table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .vb-dash th, .vb-dash td {
            text-align: left; padding: 12px 10px;
            border-bottom: 1px solid var(--vb-border);
            color: var(--vb-text);
        }
        .vb-dash th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px;
                      color: var(--vb-text-mute); font-weight: 600; }
        .vb-dash td.snippet { font-family: var(--vb-mono); color: var(--vb-text); }
        .vb-dash .badge {
            display: inline-block; padding: 2px 8px; border-radius: 999px;
            font-size: 10px; font-weight: 700; text-transform: uppercase;
        }
        .vb-dash .badge.blocked { background: var(--vb-danger-soft); color: var(--vb-danger); }
        .vb-dash .badge.allowed { background: var(--vb-amber-soft); color: var(--vb-amber); }
    </style>
</head>
<body>
    <div class="vb-dash">
        <div class="vb-dash__brand">
            <img src="icons/icon-vb.png"
                 class="vb-brand__logo"
                 alt="VaultBix"
                 width="36"
                 height="36">
            <span class="vb-dash__brand-name">VaultBix</span>
        </div>
        <h1>Dashboard</h1>
        <p class="muted">All incidents are stored locally. Nothing leaves your browser.</p>

        <section class="vb-dash-stats">
            <div class="vb-stat vb-stat--today">
                <div class="vb-stat__label">Blocked today</div>
                <div class="vb-stat__value" id="dashToday">0</div>
            </div>
            <div class="vb-stat vb-stat--total">
                <div class="vb-stat__label">All time</div>
                <div class="vb-stat__value" id="dashTotal">0</div>
            </div>
            <div class="vb-stat vb-stat--sites">
                <div class="vb-stat__label">Sites monitored</div>
                <div class="vb-stat__value" id="dashSites">0</div>
            </div>
        </section>

        <table>
            <thead>
                <tr>
                    <th>When</th>
                    <th>Type</th>
                    <th>Snippet</th>
                    <th>Destination</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="dashBody"></tbody>
        </table>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
